name: Signed Android APK - latest only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-download-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug "-PbuildVersionCode=$GITHUB_RUN_NUMBER"

      - name: Restore and verify signing key from Actions
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key in THIS repository's Actions Secrets. Secrets in the old account are not copied."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/my-download.jks"
          test -s "$RUNNER_TEMP/my-download.jks"
          keytool -list -keystore "$RUNNER_TEMP/my-download.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null

      - name: Assemble and verify signed APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/my-download.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease "-PbuildVersionCode=$GITHUB_RUN_NUMBER"
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$sha"
          echo "SIGNER_SHA256=$sha" >> "$GITHUB_ENV"
          cp "$APK" my-download-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-download-signed-apk
          path: my-download-latest.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish latest verified signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Another commit superseded this build. Release skipped."
            exit 0
          fi

          old_signer="$(gh release view latest --json body --jq .body 2>/dev/null |
            sed -n 's/^Signer SHA256: //p' | head -n 1 || true)"
          if [[ -n "$old_signer" && "$old_signer" != "$SIGNER_SHA256" ]]; then
            echo "::error::Signing certificate differs from previous release. Keeping old APK."
            exit 1
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest my-download-latest.apk --clobber
            gh release edit latest --target "$GITHUB_SHA" \
              --title "My Download 最新 APK" \
              --notes "$(printf 'Commit: %s\nSigner SHA256: %s\nversionCode: %s\n' "$GITHUB_SHA" "$SIGNER_SHA256" "$GITHUB_RUN_NUMBER")"
          else
            gh release create latest my-download-latest.apk \
              --target "$GITHUB_SHA" \
              --title "My Download 最新 APK" \
              --notes "$(printf 'Commit: %s\nSigner SHA256: %s\nversionCode: %s\n' "$GITHUB_SHA" "$SIGNER_SHA256" "$GITHUB_RUN_NUMBER")" \
              --latest
          fi

          gh release view latest --json assets --jq '.assets[].name' | grep -Fxq "my-download-latest.apk"

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "latest") | .tag_name' |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then gh release delete "$tag" --yes --cleanup-tag; fi
          done

          echo "### Latest APK successfully published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/latest" >> "$GITHUB_STEP_SUMMARY"
